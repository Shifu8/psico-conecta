events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Backend API Gateway
    upstream gateway {
        server servicio-gateway:5000;
    }

    # Microservicio asíncrono de Telemetría / WebSocket ESP32
    upstream telemetria {
        server servicio-inteligencia-iot:5006;
    }

    server {
        # Puerto 80: estándar HTTP / AWS Load Balancer
        listen 80;
        server_name _;

        # ── WebSocket ESP32: ruta principal (firmware apunta aquí) ──────────────
        location /esp32 {
            proxy_pass http://telemetria;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── WebSocket ESP32: ruta alternativa usada por el simulador ────────────
        location /ws/esp32 {
            proxy_pass http://telemetria;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── WebSocket clientes web (psicólogos/dashboard) ───────────────────────
        location /api/telemetria/ws {
            proxy_pass http://telemetria;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── API REST general → API Gateway ─────────────────────────────────────
        location / {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
